<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký Tour</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Khung form */
.form-tour{
    width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 6px 25px rgba(0,0,0,0.2);
}

/* Tiêu đề */
.form-tour h2{
    text-align:center;
    margin-bottom:25px;
}

/* Nhóm input */
.form-group{
    margin-bottom:18px;
}

/* Label */
.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    color:#555;
}

/* Input + Select */
.form-group input,
.form-group select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

/* Nút */
.form-tour button{
    width:100%;
    padding:13px;
    background:#0066cc;
    border:none;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

.form-tour button:hover{
    background:#004c99;
}

.back-btn{
    position: fixed;
    top: 20px;
    left: 20px;
    background: white;
    border: 2px solid #0066cc;
    color: #0066cc;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.back-btn:hover{
    background:#0066cc;
    color:white;
}

@media (max-width: 768px){

.form-tour{
    width: 90%;
    padding: 25px;
}

/* Nút quay lại nhỏ lại */
.back-btn{
    padding: 10px 15px;
    font-size: 14px;
}
}

</style>
</head>

<body>
<button class="back-btn" onclick="window.location.href='vietnamtravel.html'">← Quay lại</button>

<div class="form-tour">
    <h2>Đăng ký Tour</h2>

    <div class="form-group">
        <label>Họ và tên</label>
        <input type="text">
    </div>

    <div class="form-group">
        <label>Số điện thoại</label>
        <input type="text">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email">
    </div>

    <div class="form-group">
        <label>Chọn tour</label>
        <select>
            <option>Hà Nội - Đà Nẵng</option>
            <option>TP.HCM - Phú Quốc</option>
            <option>Hà Nội - Sa Pa</option>
            <option>Huế - Hội An</option>
        </select>
    </div>

    <div class="form-group">
        <label>Ngày khởi hành</label>
        <input type="date">
    </div>

    <button>Xác nhận đăng ký</button>
</div>

</body>
</html>
